[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-journey"
version = "0.1.0"
description = "Hands-on portfolio for transitioning into AI engineering"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "pydantic>=2,<3",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]